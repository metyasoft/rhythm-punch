<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rhythm Punch</title>
<meta name="description" content="Punch everything that flies at you, right on the beat. An endless one-tap rhythm action game for iPhone and iPad.">
<meta name="theme-color" content="#2A0C21">
<meta property="og:type" content="website">
<meta property="og:title" content="Rhythm Punch">
<meta property="og:description" content="Punch everything that flies at you, right on the beat. Endless one-tap rhythm action.">
<meta property="og:image" content="https://metyasoft.github.io/rhythm-punch/assets/icon.png">
<meta property="og:url" content="https://metyasoft.github.io/rhythm-punch/">
<link rel="icon" type="image/png" href="assets/icon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css" rel="stylesheet">
<style>
  :root {
    --bg: #2A0C21;
    --bg-2: #3A1230;
    --surface: #4A1539;
    --line: rgba(255, 241, 230, 0.14);
    --pink: #FF3260;
    --pink-soft: #FF7A98;
    --cyan: #4FE3E0;
    --gold: #F4C35A;
    --text: #FFF1E6;
    --muted: #D9BFCB;
    --pixel: 'Galmuri11', 'DotGothic16', 'Press Start 2P', monospace;
    --logo: 'Press Start 2P', 'Galmuri11', monospace;
    --body: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Hiragino Sans', 'Noto Sans KR', 'Noto Sans JP', 'Segoe UI', sans-serif;
  }
  :lang(ja) { --pixel: 'DotGothic16', 'Galmuri11', 'Press Start 2P', monospace; }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--body);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  img.px { image-rendering: pixelated; image-rendering: crisp-edges; }
  a { color: var(--pink-soft); }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }

  /* Header */
  header {
    position: sticky; top: 0; z-index: 50;
    background: rgba(42, 12, 33, 0.88);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 64px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); }
  .brand img { width: 34px; height: 34px; border-radius: 8px; }
  .brand span { font-family: var(--logo); font-size: 13px; letter-spacing: 1px; white-space: nowrap; }
  nav.links { display: flex; gap: 22px; }
  nav.links a { color: var(--muted); text-decoration: none; font-size: 15px; font-weight: 600; }
  nav.links a:hover { color: var(--text); }
  .lang { display: flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; flex-shrink: 0; }
  .lang button {
    background: none; border: 0; color: var(--muted); font: 600 13px var(--body);
    padding: 5px 10px; border-radius: 999px; cursor: pointer;
  }
  .lang button[aria-pressed="true"] { background: var(--pink); color: #fff; }

  /* Hero */
  .hero { position: relative; padding: 56px 0 72px; overflow: hidden; }
  .hero::before {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(60% 50% at 75% 40%, rgba(255, 50, 96, 0.28), transparent 70%),
      radial-gradient(40% 40% at 10% 90%, rgba(79, 227, 224, 0.10), transparent 70%);
    pointer-events: none;
  }
  .hero .wrap { position: relative; display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 48px; align-items: center; }
  .eyebrow { font-family: var(--logo); font-size: 11px; color: var(--pink); letter-spacing: 2px; margin-bottom: 18px; }
  .hero h1 {
    font-family: var(--pixel); font-weight: 700;
    font-size: clamp(34px, 5.4vw, 60px); line-height: 1.25; margin-bottom: 20px;
    text-shadow: 0 4px 0 rgba(0, 0, 0, 0.35);
  }
  .hero h1 em { font-style: normal; color: var(--pink); }
  .hero p.lead { font-size: clamp(17px, 2vw, 19px); color: var(--muted); max-width: 30em; margin-bottom: 30px; }
  .cta { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .store-btn {
    display: inline-flex; align-items: center; gap: 10px;
    background: var(--text); color: var(--bg); text-decoration: none;
    padding: 12px 22px; border-radius: 14px; font-weight: 800; font-size: 16px;
    box-shadow: 0 6px 0 #B8899E;
    transition: transform .12s, box-shadow .12s;
  }
  .store-btn:hover { transform: translateY(2px); box-shadow: 0 4px 0 #B8899E; }
  .store-btn svg { width: 20px; height: 20px; }
  .store-btn.soon { cursor: default; }
  .store-btn.soon:hover { transform: none; box-shadow: 0 6px 0 #B8899E; }
  .cta small { color: var(--muted); font-size: 14px; }

  /* Live demo phone */
  .phone {
    position: relative; justify-self: center;
    width: min(330px, 78vw); aspect-ratio: 9 / 19.5;
    border-radius: 44px; padding: 12px;
    background: linear-gradient(160deg, #5B1D47, #24091C);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), inset 0 0 0 2px rgba(255, 255, 255, 0.08);
  }
  .screen {
    position: relative; width: 100%; height: 100%; border-radius: 34px; overflow: hidden;
    background: #1b0915 url(assets/hero.jpg) center bottom / auto 100% no-repeat;
    cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  .screen.shake { animation: shake .16s linear; }
  @keyframes shake {
    25% { transform: translate(-3px, 1px); } 50% { transform: translate(3px, -1px); }
    75% { transform: translate(-2px, 0); } 100% { transform: none; }
  }
  .screen .hearts { position: absolute; top: 34px; left: 18px; display: flex; gap: 4px; }
  .screen .hearts img { width: 22px; height: 20px; }
  .screen .sprite { position: absolute; left: 0; top: 0; will-change: transform; pointer-events: none; }
  .screen .ring {
    position: absolute; border-radius: 50%; border: 3px solid rgba(255, 122, 152, 0.9);
    box-shadow: 0 0 16px rgba(255, 50, 96, 0.8); pointer-events: none;
  }
  .screen .tip {
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    font: 600 12px var(--body); color: #fff; background: rgba(0, 0, 0, 0.45);
    padding: 5px 12px; border-radius: 999px; white-space: nowrap; transition: opacity .3s;
  }
  .screen.fever-flash { box-shadow: inset 0 0 0 4px var(--pink), inset 0 0 40px rgba(255, 50, 96, .7); }
  .sound-toggle {
    position: absolute; right: 22px; top: 30px; z-index: 3;
    width: 34px; height: 34px; border-radius: 50%; border: 0; cursor: pointer;
    background: rgba(0, 0, 0, 0.45); color: #fff; font-size: 16px;
  }

  /* Sections */
  section.block { padding: 84px 0; }
  section.alt { background: var(--bg-2); }
  .kicker { font-family: var(--logo); font-size: 11px; color: var(--pink); letter-spacing: 2px; margin-bottom: 14px; }
  h2 { font-family: var(--pixel); font-size: clamp(26px, 3.6vw, 38px); line-height: 1.3; margin-bottom: 14px; }
  .sub { color: var(--muted); max-width: 40em; margin-bottom: 44px; font-size: 17px; }

  .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .feature {
    background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 26px 24px;
  }
  .feature .ico { height: 52px; display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  .feature .ico img { height: 44px; width: auto; }
  .feature h3 { font-size: 19px; margin-bottom: 8px; }
  .feature p { color: var(--muted); font-size: 15.5px; }

  .objects { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .obj {
    display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px 12px 16px;
  }
  .obj .pic { height: 64px; display: flex; align-items: center; justify-content: center; }
  .obj .pic img { max-height: 64px; width: auto; }
  .obj b { font-size: 15px; }
  .obj .how {
    font: 700 11px var(--logo); letter-spacing: .5px; padding: 6px 9px; border-radius: 8px;
    background: rgba(255, 50, 96, 0.16); color: var(--pink-soft);
  }
  .obj .how.no { background: rgba(244, 195, 90, 0.16); color: var(--gold); }
  .obj .how.good { background: rgba(79, 227, 224, 0.14); color: var(--cyan); }

  .roster { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
  .char { text-align: center; }
  .char .stand {
    position: relative; aspect-ratio: 1; display: flex; align-items: flex-end; justify-content: center;
    background: radial-gradient(60% 18% at 50% 92%, rgba(255, 50, 96, 0.45), transparent 70%), var(--surface);
    border: 1px solid var(--line); border-radius: 20px; margin-bottom: 12px; overflow: hidden;
  }
  .char .stand img { width: 82%; height: auto; margin-bottom: 6%; }
  .char b { display: block; font-family: var(--logo); font-size: 11px; letter-spacing: 1px; margin-bottom: 4px; }
  .char span { color: var(--muted); font-size: 14px; }
  .char.locked .stand { background: #1D1023; border-color: rgba(140, 110, 190, 0.45); align-items: center; }
  .char.locked .q { font-family: var(--logo); font-size: clamp(30px, 4vw, 48px); color: #8A74B8; text-shadow: 0 0 18px rgba(138, 116, 184, 0.6); }
  .char.locked b { color: #8A74B8; }
  .mini-lock {
    width: 44px; height: 44px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center;
    background: #1D1023; border: 2px solid rgba(140, 110, 190, 0.55); color: #8A74B8; font: 16px var(--logo);
  }
  .note { margin-top: 26px; color: var(--muted); font-size: 15.5px; }
  .note strong { color: var(--gold); }

  .gallery {
    display: grid; grid-auto-flow: column; grid-auto-columns: minmax(190px, 22%); gap: 14px;
    overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 14px;
    scrollbar-color: var(--pink) transparent;
  }
  .gallery img {
    width: 100%; aspect-ratio: 520 / 700; object-fit: cover; border-radius: 16px;
    scroll-snap-align: start; border: 1px solid var(--line); display: block;
  }

  .faq { display: grid; gap: 12px; max-width: 820px; }
  details {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px 22px;
  }
  summary { cursor: pointer; font-weight: 700; font-size: 17px; list-style: none; display: flex; justify-content: space-between; gap: 16px; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "+"; color: var(--pink); font-family: var(--logo); font-size: 14px; line-height: 1.9; }
  details[open] summary::after { content: "−"; }
  details p { color: var(--muted); margin-top: 10px; font-size: 16px; }

  footer { border-top: 1px solid var(--line); padding: 40px 0 56px; color: var(--muted); font-size: 15px; }
  footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; align-items: center; }
  footer nav { display: flex; gap: 18px; flex-wrap: wrap; }

  @media (max-width: 900px) {
    .hero .wrap { grid-template-columns: 1fr; gap: 40px; text-align: center; }
    .hero p.lead { margin-left: auto; margin-right: auto; }
    .cta { justify-content: center; }
    .features { grid-template-columns: 1fr 1fr; }
    .roster { grid-template-columns: repeat(3, 1fr); }
    nav.links { display: none; }
  }
  @media (max-width: 560px) {
    .features { grid-template-columns: 1fr; }
    .roster { grid-template-columns: repeat(2, 1fr); }
    .gallery { grid-auto-columns: 62%; }
    section.block { padding: 64px 0; }
    .brand span { font-size: 11px; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .screen.shake { animation: none; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="brand" href="#top"><img src="assets/icon.png" alt=""><span>RHYTHM PUNCH</span></a>
    <nav class="links">
      <a href="#features" data-i18n="nav_features"></a>
      <a href="#characters" data-i18n="nav_characters"></a>
      <a href="#stages" data-i18n="nav_stages"></a>
      <a href="#faq" data-i18n="nav_faq"></a>
    </nav>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="ko">한국어</button>
      <button type="button" data-lang="ja">日本語</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="wrap">
      <div>
        <div class="eyebrow">ENDLESS · ONE TAP · RHYTHM ACTION</div>
        <h1 data-i18n-html="hero_title"></h1>
        <p class="lead" data-i18n="hero_lead"></p>
        <div class="cta">
          <!-- 출시 후: href를 App Store 주소로 바꾸고 class="soon"을 지우세요. -->
          <a class="store-btn soon" id="store-btn" href="#" aria-disabled="true">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.37 12.6c-.03-2.6 2.12-3.85 2.22-3.91-1.21-1.77-3.09-2.01-3.76-2.04-1.6-.16-3.12.94-3.93.94-.81 0-2.06-.92-3.39-.89-1.74.03-3.35 1.01-4.25 2.57-1.81 3.14-.46 7.79 1.3 10.34.86 1.25 1.89 2.65 3.23 2.6 1.3-.05 1.79-.84 3.36-.84 1.57 0 2.01.84 3.38.81 1.4-.02 2.28-1.27 3.13-2.53.99-1.45 1.39-2.85 1.42-2.92-.03-.01-2.72-1.04-2.75-4.13zM13.78 4.95c.71-.86 1.19-2.06 1.06-3.25-1.02.04-2.27.68-3 1.54-.66.76-1.24 1.98-1.08 3.15 1.14.09 2.31-.58 3.02-1.44z"/></svg>
            <span data-i18n="store_btn"></span>
          </a>
          <small data-i18n="store_note"></small>
        </div>
      </div>

      <div class="phone">
        <div class="screen" id="demo" aria-label="Rhythm Punch gameplay demo">
          <div class="hearts">
            <img class="px" src="assets/sprites/heart.png" alt=""><img class="px" src="assets/sprites/heart.png" alt=""><img class="px" src="assets/sprites/heart.png" alt="">
          </div>
          <button class="sound-toggle" id="sound" type="button" aria-label="Sound">🔇</button>
          <div class="tip" id="tip" data-i18n="demo_tip"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="block alt" id="features">
    <div class="wrap">
      <div class="kicker">FEATURES</div>
      <h2 data-i18n="features_title"></h2>
      <p class="sub" data-i18n="features_sub"></p>
      <div class="features">
        <div class="feature">
          <div class="ico"><img class="px" src="assets/sprites/rock.png" alt=""><img class="px" src="assets/sprites/pot.png" alt=""><img class="px" src="assets/sprites/ball.png" alt=""></div>
          <h3 data-i18n="f1_t"></h3><p data-i18n="f1_d"></p>
        </div>
        <div class="feature">
          <div class="ico"><img class="px" src="assets/sprites/star.png" alt=""></div>
          <h3 data-i18n="f2_t"></h3><p data-i18n="f2_d"></p>
        </div>
        <div class="feature">
          <div class="ico"><img class="px" src="assets/sprites/heart.png" alt=""><img class="px" src="assets/sprites/basketball.png" alt=""></div>
          <h3 data-i18n="f3_t"></h3><p data-i18n="f3_d"></p>
        </div>
        <div class="feature">
          <div class="ico"><img class="px" src="assets/sprites/bomb.png" alt=""><img class="px" src="assets/sprites/ghost.png" alt=""></div>
          <h3 data-i18n="f4_t"></h3><p data-i18n="f4_d"></p>
        </div>
        <div class="feature">
          <div class="ico"><img class="px" src="assets/sprites/grumpy-fellow.png" alt=""><span class="mini-lock" aria-hidden="true">?</span><span class="mini-lock" aria-hidden="true">?</span></div>
          <h3 data-i18n="f5_t"></h3><p data-i18n="f5_d"></p>
        </div>
        <div class="feature">
          <div class="ico"><img class="px" src="assets/sprites/safe.png" alt=""></div>
          <h3 data-i18n="f6_t"></h3><p data-i18n="f6_d"></p>
        </div>
      </div>
    </div>
  </section>

  <section class="block" id="objects">
    <div class="wrap">
      <div class="kicker">HOW TO HIT</div>
      <h2 data-i18n="objects_title"></h2>
      <p class="sub" data-i18n="objects_sub"></p>
      <div class="objects">
        <div class="obj"><div class="pic"><img class="px" src="assets/sprites/rock.png" alt="" style="height:48px"></div><b data-i18n="o_rock"></b><span class="how">TAP</span></div>

        <div class="obj"><div class="pic"><img class="px" src="assets/sprites/ball.png" alt="" style="height:40px"></div><b data-i18n="o_ball"></b><span class="how">TAP</span></div>
        <div class="obj"><div class="pic"><img class="px" src="assets/sprites/barrel.png" alt="" style="height:52px"></div><b data-i18n="o_barrel"></b><span class="how">TAP</span></div>
        <div class="obj"><div class="pic"><img class="px" src="assets/sprites/ufo.png" alt="" style="height:52px"></div><b data-i18n="o_ufo"></b><span class="how">TAP TAP</span></div>
        <div class="obj"><div class="pic"><img class="px" src="assets/sprites/bird1.png" alt="" style="height:48px"></div><b data-i18n="o_bird"></b><span class="how">UPPERCUT</span></div>
        <div class="obj"><div class="pic"><img class="px" src="assets/sprites/bomb.png" alt="" style="height:56px"></div><b data-i18n="o_bomb"></b><span class="how no">DON'T TOUCH</span></div>
        <div class="obj"><div class="pic"><img class="px" src="assets/sprites/heart.png" alt="" style="height:56px"></div><b data-i18n="o_heart"></b><span class="how good">HP +1</span></div>
        <div class="obj"><div class="pic"><img class="px" src="assets/sprites/ghost.png" alt="" style="height:52px"></div><b data-i18n="o_ghost"></b><span class="how">TAP</span></div>
        <div class="obj"><div class="pic"><img class="px" src="assets/sprites/safe.png" alt="" style="height:64px"></div><b data-i18n="o_safe"></b><span class="how">TAP</span></div>
      </div>
    </div>
  </section>

  <section class="block alt" id="characters">
    <div class="wrap">
      <div class="kicker">CHARACTERS</div>
      <h2 data-i18n="chars_title"></h2>
      <p class="sub" data-i18n="chars_sub"></p>
      <div class="roster">
        <div class="char"><div class="stand"><img class="px" src="assets/sprites/grumpy-fellow.png" alt="Grumpy Fellow"></div><b>GRUMPY FELLOW</b><span data-i18n="c_grumpy"></span></div>
        <div class="char locked"><div class="stand"><span class="q" aria-hidden="true">?</span></div><b>? ? ?</b><span data-i18n="c_locked"></span></div>
        <div class="char locked"><div class="stand"><span class="q" aria-hidden="true">?</span></div><b>? ? ?</b><span data-i18n="c_locked"></span></div>

        <div class="char locked"><div class="stand"><span class="q" aria-hidden="true">?</span></div><b>? ? ?</b><span data-i18n="c_locked"></span></div>
      </div>
      <p class="note" data-i18n-html="chars_note"></p>

  </section>

  <section class="block" id="stages">
    <div class="wrap">
      <div class="kicker">STAGES</div>
      <h2 data-i18n="stages_title"></h2>
      <p class="sub" data-i18n="stages_sub"></p>
      <div class="gallery" id="gallery"></div>

  </section>

  <section class="block alt" id="faq">
    <div class="wrap">
      <div class="kicker">FAQ</div>
      <h2 data-i18n="faq_title"></h2>
      <div class="faq">
        <details><summary data-i18n="q1"></summary><p data-i18n="a1"></p></details>
        <details><summary data-i18n="q2"></summary><p data-i18n="a2"></p></details>
        <details><summary data-i18n="q3"></summary><p data-i18n="a3"></p></details>

</main>

<footer>
  <div class="wrap">
    <span>© 2026 Pixelab · Rhythm Punch</span>
    <nav>
      <a href="mailto:metyasoft@gmail.com" data-i18n="footer_contact"></a>
      <a href="privacy.html" data-i18n="footer_privacy"></a>
    </nav>
  </div>
</footer>

<script>
const I18N = {
  ko: {

function storedLang() {
  try { return localStorage.getItem('rp.lang'); } catch (e) { return null; }
}
function pickLang() {
  const saved = storedLang();
  if (saved && I18N[saved]) return saved;
  const nav = (navigator.language || 'en').slice(0, 2);
  return I18N[nav] ? nav : 'en';
}
function applyLang(lang) {
  const t = I18N[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t[el.dataset.i18n]; });
  document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t[el.dataset.i18nHtml]; });
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  try { localStorage.setItem('rp.lang', lang); } catch (e) {}
}
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => applyLang(b.dataset.lang)));
applyLang(pickLang());

document.getElementById('store-btn').addEventListener('click', e => {
  if (e.currentTarget.classList.contains('soon')) e.preventDefault();
});

for (let i = 1; i <= 13; i++) {

// ---------------------------------------------------------------
// Live demo: objects arrive on the beat (120 BPM). It plays itself;
// tap the screen to take over. Same layout rules as the game: a
// 1040x1400 canvas anchored bottom-centre, ground line at 228.
// ---------------------------------------------------------------
(function demo() {
  const screen = document.getElementById('demo');
  const tip = document.getElementById('tip');
  const soundBtn = document.getElementById('sound');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const BEAT = 500;                 // ms per beat at 120 BPM
  const FLIGHT = 2 * BEAT;          // spawn -> hit point
  const PERFECT = 60, GOOD = 130;   // judgement windows (ms), a little kinder than the game
  const SEQ = ['rock', 'pot', 'ball', 'barrel', 'rock', 'basketball', 'bomb', 'pot', 'rock', 'heart', 'ball', 'safe'];
  const ART = { rock: [14, 12], pot: [12, 15], ball: [12, 10], barrel: [12, 13], basketball: [14, 15], bomb: [13, 14], heart: [18, 16], safe: [21, 27] };

  function el(tag, cls, src) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (src) { e.src = src; e.alt = ''; e.classList.add('px'); }
    screen.appendChild(e);
    return e;
  }

  const fighter = el('img', 'sprite', 'assets/sprites/grumpy-fellow.png');
  const ring = el('div', 'ring');
  const star = el('img', 'sprite', 'assets/sprites/star.png');
  star.style.opacity = 0;
  const punchSrc = 'assets/sprites/grumpy-fellow-punch.png', idleSrc = 'assets/sprites/grumpy-fellow.png';
  new Image().src = punchSrc;

  let W, H, k, groundY, fx, hitX, laneY, charPx;
  function layout() {
    W = screen.clientWidth; H = screen.clientHeight;
    k = H / 1400;                         // the canvas fills the height; sides are cropped
    charPx = Math.round(140 * k);
    groundY = H - 228 * k;
    fx = W * 0.40;
    hitX = fx + charPx * 0.46;
    laneY = groundY - charPx * 0.62;
    fighter.style.width = fighter.style.height = charPx + 'px';
    fighter.style.transform = `translate(${fx - charPx / 2}px, ${groundY - charPx}px)`;
    const r = charPx * 0.5;
    ring.style.width = ring.style.height = r + 'px';
    ring.style.left = (hitX + r * 0.15) + 'px';
    ring.style.top = (laneY - r / 2) + 'px';
    star.style.width = star.style.height = Math.round(charPx * 0.6) + 'px';
  }
  layout();
  window.addEventListener('resize', layout);

  if (reduced) {
    const rock = el('img', 'sprite', 'assets/sprites/rock.png');
    const s = 5.2 * k;
    rock.style.width = 14 * s + 'px';
    rock.style.transform = `translate(${W * 0.72}px, ${laneY - 6 * s}px)`;
    tip.style.display = 'none';
    soundBtn.style.display = 'none';
    return;
  }

  // ---- sound (only after the visitor asks for it) ----
  let ctx = null, soundOn = false;
  function ensureAudio() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ctx = null; } }
    if (ctx && ctx.state === 'suspended') ctx.resume();
  }
  function setSound(on) {
    soundOn = on; soundBtn.textContent = on ? '🔊' : '🔇';
    if (on) ensureAudio();
  }
  soundBtn.addEventListener('pointerdown', e => { e.stopPropagation(); setSound(!soundOn); });
  function noise(dur, freq, gain) {
    if (!soundOn || !ctx) return;
    const len = Math.floor(ctx.sampleRate * dur), buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 1.2; g.gain.value = gain;
    src.buffer = buf; src.connect(f).connect(g).connect(ctx.destination); src.start();
  }
  function tone(freq, dur, gain, type = 'sine', slide = 0) {
    if (!soundOn || !ctx) return;
    const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime;
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + dur);
  }
  const CUE = {
    rock: () => noise(0.05, 2400, 0.5),
    pot: () => tone(1100, 0.07, 0.35, 'triangle'),
    ball: () => { noise(0.03, 7000, 0.25); tone(1800, 0.12, 0.12, 'sine', 1.3); },
    barrel: () => tone(140, 0.25, 0.5, 'sine', 0.7),
    basketball: () => tone(320, 0.1, 0.35, 'triangle', 0.6),
    bomb: () => noise(0.18, 5000, 0.18),
    heart: () => { tone(880, 0.08, 0.2, 'square'); setTimeout(() => tone(1320, 0.1, 0.2, 'square'), 70); },
    safe: () => tone(90, 0.35, 0.5, 'sawtooth', 0.5)
  };
  function hitSound(perfect) { tone(110, 0.14, 0.7, 'sine', 0.5); noise(0.08, perfect ? 1800 : 900, 0.55); }
  function whiff() { noise(0.12, 600, 0.2); }

  // ---- objects ----
  const objs = [];
  let seqIndex = 0, nextSpawn = 0, manualUntil = 0, start = performance.now();
  let punchUntil = 0, hurtUntil = 0;

  function spawn(arrival) {
    const kind = SEQ[seqIndex++ % SEQ.length];
    const [aw, ah] = ART[kind];
    const s = 5.2 * k * (kind === 'safe' ? 1.1 : 1);
    const node = el('img', 'sprite', `assets/sprites/${kind}.png`);
    node.style.width = aw * s + 'px'; node.style.height = ah * s + 'px';
    objs.push({ kind, node, w: aw * s, h: ah * s, arrival, state: 'fly', t0: 0, vx: 0, vy: 0, rot: 0 });
    CUE[kind]();
  }

  function flashStar(big) {
    star.style.transition = 'none';
    star.style.opacity = 1;
    star.style.transform = `translate(${hitX - star.clientWidth / 2}px, ${laneY - star.clientHeight / 2}px) scale(${big ? 1.25 : 0.85})`;
    requestAnimationFrame(() => {
      star.style.transition = 'opacity .18s ease-out, transform .18s ease-out';
      star.style.opacity = 0;
      star.style.transform += ' scale(1.2)';
    });
    if (big) { screen.classList.remove('shake'); void screen.offsetWidth; screen.classList.add('shake'); }
  }

  function punch(now) {
    punchUntil = now + 140;
    // Find the closest object still in flight.
    let best = null, bestDt = Infinity;
    for (const o of objs) {
      if (o.state !== 'fly') continue;
      const dt = Math.abs(now - o.arrival);
      if (dt < bestDt) { best = o; bestDt = dt; }
    }
    if (!best || bestDt > GOOD) { whiff(); return; }
    if (best.kind === 'bomb') {
      best.state = 'boom'; best.t0 = now;
      screen.classList.add('fever-flash'); setTimeout(() => screen.classList.remove('fever-flash'), 180);
      noise(0.35, 300, 0.8); hurtUntil = now + 300;
      return;
    }
    const perfect = bestDt <= PERFECT;
    best.state = 'away'; best.t0 = now;
    best.vx = W * (1.5 + Math.random() * 0.4); best.vy = -H * (0.5 + Math.random() * 0.4); best.rot = 720 + Math.random() * 360;
    flashStar(perfect);
    hitSound(perfect);
  }

  screen.addEventListener('pointerdown', e => {
    e.preventDefault();
    const now = performance.now();
    if (now >= manualUntil) tip.style.opacity = 0;
    manualUntil = now + 5000;
    if (!soundOn) setSound(true);
    punch(now);
  });

  // Pause off-screen; on return, drop stale objects so they don't all count as misses.
  function reset() {
    objs.splice(0).forEach(o => o.node.remove());
    nextSpawn = 0;
  }
  let running = true;
  new IntersectionObserver(es => {
    const vis = es[0].isIntersecting;
    if (vis && !running) { reset(); running = true; requestAnimationFrame(frame); }
    running = vis;
  }).observe(screen);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) reset(); });

  function frame(now) {
    if (!running) return;
    const auto = now >= manualUntil;
    if (auto) tip.style.opacity = 1;

    // Spawn on every second beat, aligned to the beat grid.
    const beatIdx = Math.floor((now - start) / BEAT);
    if (nextSpawn === 0 || now >= nextSpawn) {
      const base = start + (beatIdx + 1) * BEAT;
      nextSpawn = base + 2 * BEAT;
      spawn(base + FLIGHT);
    }

    // Beat pulse on the hit ring.
    const phase = ((now - start) % BEAT) / BEAT;
    const pulse = 1 + 0.18 * Math.pow(1 - phase, 3);
    ring.style.transform = `scale(${pulse})`;
    ring.style.opacity = 0.55 + 0.45 * Math.pow(1 - phase, 2);

    for (let i = objs.length - 1; i >= 0; i--) {
      const o = objs[i];
      let x, y, r = 0, a = 1;
      if (o.state === 'fly') {
        if (auto && o.kind !== 'bomb' && now >= o.arrival) punch(now);
        const p = 1 - (o.arrival - now) / FLIGHT;
        const startX = W + o.w;
        x = startX + (hitX - startX) * p;
        y = laneY;
        if (o.state === 'fly' && now > o.arrival + GOOD) {
          if (o.kind === 'bomb') { o.state = 'pass'; }
          else { o.state = 'hurt'; hurtUntil = now + 260; noise(0.15, 400, 0.4); }
          o.t0 = now;
        }
      }
      if (o.state === 'away') {
        const t = (now - o.t0) / 1000;
        x = hitX + o.vx * t; y = laneY + o.vy * t + 900 * k * t * t * 2; r = o.rot * t; a = Math.max(0, 1 - t * 1.8);
      } else if (o.state === 'pass' || o.state === 'hurt') {
        const t = (now - o.t0) / 1000;
        const p = 1 - (o.arrival - now) / FLIGHT;
        x = W + o.w + (hitX - W - o.w) * p; y = laneY + (o.state === 'hurt' ? 600 * k * t * t : 0); a = Math.max(0, 1 - t * 2.5);
      } else if (o.state === 'boom') {
        const t = (now - o.t0) / 1000;
        x = hitX; y = laneY; r = 0; a = Math.max(0, 1 - t * 4);
        o.node.style.filter = 'brightness(3) saturate(0)';
        o.node.style.width = o.w * (1 + t * 6) + 'px';
      }
      o.node.style.opacity = a;
      o.node.style.transform = `translate(${x - o.w / 2}px, ${y - o.h / 2}px) rotate(${r}deg)`;
      if (a <= 0 || x < -200 || x > W + 400) { o.node.remove(); objs.splice(i, 1); }
    }

    const pose = now < punchUntil ? punchSrc : idleSrc;
    if (fighter.dataset.pose !== pose) { fighter.src = pose; fighter.dataset.pose = pose; }
    const hurt = now < hurtUntil ? 'brightness(1.6) sepia(1) hue-rotate(-40deg) saturate(4)' : 'none';
    if (fighter.style.filter !== hurt) fighter.style.filter = hurt;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
